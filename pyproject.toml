[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-logistics-4-decision-intelligence"
version = "1.0.0"
description = "Decision Intelligence, IoT & MLOps Platform for Last-Mile Logistics and Care Delivery"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Guillén Concepción", email = "guillenconcepcion@gmail.com" }
]
keywords = [
    "decision-intelligence",
    "logistics-4-0",
    "machine-learning",
    "mlops",
    "xai",
    "shap",
    "streamlit",
    "mlflow",
    "iot",
    "vrp"
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2.5.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "shap>=0.42.0",
    "networkx>=3.0",
    "pydantic>=2.5.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "mlflow>=2.10.0",
    "pyyaml>=6.0",
    "joblib>=1.3.0",
    "requests>=2.31.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
